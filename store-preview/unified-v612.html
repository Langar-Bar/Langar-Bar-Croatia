<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Langar Bar Unified V6.2.2 Final Test</title>
<style>:root{--g:#123f2e;--gold:#d8b24a;--ink:#080808;--bg:#07120e}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);font-family:Arial,Helvetica,sans-serif}.shell{height:100%;display:grid;grid-template-rows:auto 1fr}.top{display:flex;align-items:center;gap:7px;padding:max(8px,env(safe-area-inset-top)) 9px 8px;background:#0b1914;border-bottom:1px solid rgba(255,255,255,.12);z-index:30}.brand{margin-right:auto;color:#fff;font-weight:950;white-space:nowrap}.brand small{display:block;font-size:10px;color:#c8c8c8;font-weight:650}.mode{border:1px solid rgba(216,178,74,.52);border-radius:12px;padding:9px 11px;font-weight:900;transition:transform .16s ease,box-shadow .2s ease,filter .2s ease}.mode:active{transform:scale(.96)}.customer{background:var(--gold);color:var(--ink)}.staff{background:var(--g);color:var(--gold)}.mode.active{outline:2px solid #fff;outline-offset:1px;box-shadow:0 8px 22px rgba(0,0,0,.28)}.staff.verified::after{content:' ✓';color:#fff}.role{font-size:10px;color:#ddd;max-width:175px;text-align:right}.stage{min-height:0;position:relative}.frame{position:absolute;inset:0;border:0;width:100%;height:100%;visibility:hidden;opacity:0;pointer-events:none;background:var(--bg);transition:opacity .22s ease}.frame.active{visibility:visible;opacity:1;pointer-events:auto}.loading{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:900;background:var(--bg);z-index:20}.loading.hidden{display:none}@media(max-width:680px){.role,.brand small{display:none}.top{gap:5px}.mode{font-size:11px;padding:8px 9px}.brand{font-size:14px}}@media(prefers-reduced-motion:reduce){.mode,.frame{transition:none!important}}</style></head>
<body><div class="shell"><header class="top"><div class="brand">Langar Bar <small>One App · Customer + Secure Staff Console · V6.2.2</small></div><button id="customerMode" class="mode customer active" type="button">Customer</button><button id="staffMode" class="mode staff" type="button">Staff Access</button><div id="roleStatus" class="role">Customer mode</div></header><main class="stage"><div id="loading" class="loading">Loading Langar Bar…</div><iframe id="customerFrame" class="frame active" src="index.html?v=622-unified" allow="clipboard-read;clipboard-write;notifications;autoplay"></iframe><iframe id="adminFrame" class="frame" src="admin.html?v=622-unified" allow="clipboard-read;clipboard-write;notifications;autoplay"></iframe></main></div>
<script>(()=>{const cf=document.getElementById('customerFrame'),af=document.getElementById('adminFrame'),cb=document.getElementById('customerMode'),sb=document.getElementById('staffMode'),rs=document.getElementById('roleStatus'),load=document.getElementById('loading');let adminVerified=false,adminRole=null;const add=(d,tag,attrs)=>{const x=d.createElement(tag);Object.assign(x,attrs);(tag==='link'?d.head:d.body).appendChild(x)};
const clientScripts=['js/client-opening-v619.js?v=622','js/client-v610.js?v=622','js/client-v613.js?v=622','js/client-experience-v613.js?v=622','js/client-referral-v613.js?v=622','js/client-sushi-v618.js?v=622','js/client-applications-v620.js?v=622','js/client-final-v622.js?v=622'];const adminScripts=['js/admin-v609.js?v=622','js/admin-v610.js?v=622','js/admin-experience-v613.js?v=622','js/admin-menu-v614.js?v=622','js/admin-rewards-v615.js?v=622','js/admin-notifications-v616.js?v=622','js/admin-applications-v620.js?v=622','js/admin-alerts-v622.js?v=622','js/admin-unified-bridge-v621.js?v=622'];
cf.addEventListener('load',()=>{try{const d=cf.contentDocument;add(d,'link',{rel:'stylesheet',href:'css/client-v613.css?v=622'});clientScripts.forEach(src=>add(d,'script',{src}));load.classList.add('hidden')}catch(e){load.textContent='Customer preview error: '+e.message}});
af.addEventListener('load',()=>{try{const d=af.contentDocument;['css/admin-v609.css?v=622','css/admin-v610.css?v=622'].forEach(href=>add(d,'link',{rel:'stylesheet',href}));adminScripts.forEach(src=>add(d,'script',{src}))}catch(e){console.error(e)}});
function show(mode){const isAdmin=mode==='admin';cf.classList.toggle('active',!isAdmin);af.classList.toggle('active',isAdmin);cb.classList.toggle('active',!isAdmin);sb.classList.toggle('active',isAdmin);if(isAdmin&&!adminVerified){rs.textContent='Staff sign-in required';localStorage.langar_unified_last_mode='staff-login'}else{rs.textContent=isAdmin?`Admin verified · ${adminRole||'staff'}`:'Customer mode';localStorage.langar_unified_last_mode=isAdmin?'admin':'customer'}}
cb.onclick=()=>show('customer');sb.onclick=()=>show('admin');window.addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.type!=='langar-admin-state')return;adminVerified=!!e.data.authorized;adminRole=e.data.role||null;sb.classList.toggle('verified',adminVerified);sb.textContent=adminVerified?'Admin Console':'Staff Access';if(adminVerified){rs.textContent=`Admin verified · ${adminRole}`;if(['admin','staff-login'].includes(localStorage.langar_unified_last_mode||''))show('admin')}else if(af.classList.contains('active'))rs.textContent='Staff sign-in required'});if(localStorage.langar_unified_last_mode==='admin'||localStorage.langar_unified_last_mode==='staff-login')show('admin')})();</script></body></html>
