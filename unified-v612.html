<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Langar Bar Unified V6.1.2 Test</title>
<style>
:root{--green:#123f2e;--gold:#d8b24a;--ink:#0a0a0a;--bg:#07120e}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);font-family:Arial,Helvetica,sans-serif}.shell{height:100%;display:grid;grid-template-rows:auto 1fr}.top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#0b1914;border-bottom:1px solid rgba(255,255,255,.12);position:relative;z-index:5}.brand{color:#fff;font-weight:900;margin-right:auto}.brand small{display:block;color:#bdbdbd;font-weight:600;font-size:11px}.mode{border:1px solid rgba(216,178,74,.5);border-radius:12px;padding:9px 12px;font-weight:900;cursor:pointer}.mode.customer{background:var(--gold);color:var(--ink)}.mode.admin{background:var(--green);color:var(--gold)}.mode.active{outline:2px solid #fff;outline-offset:1px}.status{font-size:11px;color:#ddd;max-width:210px;text-align:right}.stage{min-height:0;position:relative}.frame{border:0;width:100%;height:100%;display:none;background:var(--bg)}.frame.active{display:block}@media(max-width:640px){.brand small,.status{display:none}.top{gap:6px}.mode{padding:9px 10px;font-size:12px}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">Langar Bar <small>Unified App V6.1.2 Test</small></div>
    <button id="customerMode" class="mode customer active" type="button">Customer App</button>
    <button id="adminMode" class="mode admin" type="button">Staff / Admin</button>
    <div id="roleStatus" class="status">Admin access is protected by the existing Supabase admin login.</div>
  </header>
  <main class="stage">
    <iframe id="customerFrame" class="frame active" src="app-v610.html?v=612" allow="clipboard-read;clipboard-write;notifications;autoplay"></iframe>
    <iframe id="adminFrame" class="frame" src="admin-v609.html?v=612" allow="clipboard-read;clipboard-write;notifications;autoplay"></iframe>
  </main>
</div>
<script>
(()=>{
 const c=document.getElementById('customerMode'),a=document.getElementById('adminMode'),cf=document.getElementById('customerFrame'),af=document.getElementById('adminFrame'),s=document.getElementById('roleStatus');
 function show(which){const admin=which==='admin';cf.classList.toggle('active',!admin);af.classList.toggle('active',admin);c.classList.toggle('active',!admin);a.classList.toggle('active',admin);localStorage.langar_unified_last_mode=which;if(admin)s.textContent='Staff/Admin mode — login is required and Supabase verifies the admin role.';else s.textContent='Customer mode — normal users never receive admin privileges.'}
 c.onclick=()=>show('customer');a.onclick=()=>show('admin');
 if(localStorage.langar_unified_last_mode==='admin')show('admin');
 window.addEventListener('message',e=>{if(e?.data?.type==='langar-admin-authorized')s.textContent='Admin role verified.'});
})();
</script>
</body>
</html>
